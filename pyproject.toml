[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sciweave"
version = "0.2.0"
description = "Structured experiment scaffolding for ML research teams with MLflow integration"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    { name = "Vivek Handebagh" }
]
keywords = [
    "experiment-tracking",
    "machine-learning",
    "scientific-research",
    "mlflow",
    "databricks",
    "reproducibility",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mlflow>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/vivekhandebagh/sciweave"
Repository = "https://github.com/vivekhandebagh/sciweave"
Issues = "https://github.com/vivekhandebagh/sciweave/issues"

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "build>=1.3.0",
    "twine>=6.2.0",
]
