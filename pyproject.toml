[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sciweave"
version = "0.1.0"
description = "A lightweight, flexible experiment tracking framework for scientific research"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Vivek Handebagh" }
]
keywords = [
    "experiment-tracking",
    "machine-learning",
    "scientific-research",
    "data-science",
    "reproducibility",
    "sqlite",
    "hydra"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Database",
]
dependencies = [
    "hydra-core>=1.3.2",
]

[project.urls]
Homepage = "https://github.com/vivekhandebagh/sciweave"
Repository = "https://github.com/vivekhandebagh/sciweave"
Issues = "https://github.com/vivekhandebagh/sciweave/issues"

[dependency-groups]
dev = [
    "build>=1.3.0",
    "twine>=6.2.0",
]
