[project]
name = "sciweave-mcp"
version = "0.2.0"
description = "Unified MCP server for MLflow queries, experiment scaffolding, and tracking"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.2.0",
    "mlflow>=2.0.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.scripts]
sciweave-mcp = "sciweave_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
