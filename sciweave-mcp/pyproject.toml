[project]
name = "sciweave-mcp"
version = "0.1.0"
description = "MCP server for querying MLflow experiments"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.2.0",
    "mlflow>=2.0.0",
]

[project.scripts]
sciweave-mcp = "sciweave_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
